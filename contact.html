<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 - 钢结构技术管理系统</title>
<meta name="description" content="联系我们获取钢结构技术管理系统试用授权、技术咨询与售后服务。">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<header id="site-header"></header>

<main>
  <section class="page-hero blueprint">
    <div class="container page-hero-inner">
      <div class="section-eyebrow" style="color:#60a5fa">CONTACT</div>
      <h1>联系我们</h1>
      <p>获取试用授权、咨询购买、提交问题或建议，请通过以下任一方式联系。建议优先添加微信，响应最快。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="contact-grid">
        <div class="contact-card reveal">
          <div class="ico">💬</div>
          <h3>微信</h3>
          <p>添加好友时请备注「钢构软件」</p>
          <p class="big">shiqianjushoupro</p>
          <p style="margin-top:8px;font-size:12.5px;color:var(--ink-4)">工作时间：9:00 - 18:00</p>
        </div>
        <div class="contact-card reveal">
          <div class="ico">📱</div>
          <h3>扫码添加</h3>
          <p>微信扫一扫，直达开发者</p>
          <img src="images/wechat_qr.png" alt="微信二维码"
               style="width:150px;height:150px;object-fit:contain;border:1px solid var(--line);border-radius:8px;margin:10px auto;display:block">
        </div>
        <div class="contact-card reveal">
          <div class="ico">☎️</div>
          <h3>电话</h3>
          <p>紧急问题优先电话联系</p>
          <p class="big">15034167945</p>
          <p style="margin-top:8px;font-size:12.5px;color:var(--ink-4)">周一至周五 9:00 - 18:00</p>
        </div>
      </div>

      <div class="panel-info" style="margin-top:34px">
        <h4>获取试用授权</h4>
        <p style="color:var(--ink-3);font-size:14px">
          新用户可申请试用授权。请将本机激活窗口显示的<b>机器码</b>（64 位大写十六进制）随消息一并发送，
          我们会在收到后尽快为您生成授权码。
        </p>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/main.js"></script>
</body>
</html>
